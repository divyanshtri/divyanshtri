name: Update GitHub Profile

on:
  schedule:
    # Runs every day at 00:30 UTC
    - cron: "30 0 * * *"

  # Allows us to run it manually from GitHub
  workflow_dispatch:


permissions:
  contents: write


jobs:

  update-profile:

    runs-on: ubuntu-latest

    steps:

      - name: Checkout repository
        uses: actions/checkout@v4


      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"


      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt


      - name: Fetch contribution data
        run: |
          python scripts/fetch_contributions.py


      - name: Generate contribution heatmap
        run: |
          python scripts/render_heatmap_svg.py


      - name: Commit updated profile
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add data/contributions.json
          git add assets/contrib-heatmap.svg

          git diff --cached --quiet || git commit -m "chore: update contribution heatmap"

          git push