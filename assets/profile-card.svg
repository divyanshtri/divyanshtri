<svg
xmlns="http://www.w3.org/2000/svg"
width="100%"
viewBox="0 0 1100 540"
preserveAspectRatio="xMidYMid meet"
>

<style>


/* ================================================
   BACKGROUND
================================================ */

.background {
    fill: #0d1117;
}


/* ================================================
   TERMINAL TEXT
================================================ */

.terminal {
    font-family: "Courier New", monospace;
    font-size: 17px;
    fill: #3fb950;
}


/* ================================================
   ASCII PORTRAIT
================================================ */

.ascii-line {

    font-family: "Courier New", monospace;

    font-size: 8px;

    fill: #f0f6fc;
    
    opacity: 0;

    animation: asciiAppear 0.15s forwards;
}


@keyframes asciiAppear {

    from {
        opacity: 0;
        transform: translateY(3px);
    }

    to {
        opacity: 1;
        transform: translateY(0);
    }

}


/* ================================================
   NAME
================================================ */

.name {

    font-family: "Courier New", monospace;

    font-size: 28px;

    font-weight: bold;

    fill: #58a6ff;

    opacity: 0;

    animation: fadeIn 0.6s forwards;

    animation-delay: 0.45s;
}


/* ================================================
   SEPARATOR
================================================ */

.separator {

    stroke: #30363d;

    stroke-width: 2;

    stroke-dasharray: 430;

    stroke-dashoffset: 430;

    animation: drawLine 0.9s forwards;

    animation-delay: 0.7s;
}


@keyframes drawLine {

    to {
        stroke-dashoffset: 0;
    }

}


/* ================================================
   PROFILE INFORMATION
================================================ */

.info-line {

    font-family: "Courier New", monospace;

    font-size: 16px;

    opacity: 0;

    animation: fadeIn 0.45s forwards;
}


.label {
    fill: #8b949e;
    font-weight: bold;
}


.value {
    fill: #c9d1d9;
}


/* ================================================
   CURSOR
================================================ */

.cursor {

    fill: #3fb950;

    animation: blink 1s steps(2, start) infinite;
}


@keyframes blink {

    50% {
        opacity: 0;
    }

}


/* ================================================
   GENERAL FADE
================================================ */

@keyframes fadeIn {

    from {
        opacity: 0;
        transform: translateY(5px);
    }

    to {
        opacity: 1;
        transform: translateY(0);
    }

}



